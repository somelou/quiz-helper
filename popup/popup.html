<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="../shared/variables.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="header">
    <h2>题目助手</h2>
    <div class="theme-toggle" id="themeToggle">
      <button class="theme-btn" data-theme="light" title="浅色模式">
        <span data-icon="sun"></span>
      </button>
      <button class="theme-btn" data-theme="dark" title="深色模式">
        <span data-icon="moon"></span>
      </button>
      <button class="theme-btn" data-theme="system" title="跟随系统">
        <span data-icon="system"></span>
      </button>
    </div>
  </div>
  <button class="btn btn-primary" id="analyzeBtn">分析当前页面题目</button>
  <button class="btn btn-secondary" id="optionsBtn">打开设置</button>
  <div class="model-dropdown" id="modelDropdown">
    <button class="btn btn-secondary model-dropdown-btn" id="modelDropdownBtn">
      <span class="model-dropdown-label">无可用模型</span>
      <span class="model-dropdown-arrow"></span>
    </button>
    <div class="model-dropdown-menu" id="modelDropdownMenu"></div>
  </div>
  <div class="hint" id="popupHint">提示：选中题目文本后分析效果更佳</div>
  <script src="../icons.js"></script>
  <script src="../shared/constants.js"></script>
  <script src="../shared/shortcut-utils.js"></script>
  <script src="../shared/theme-utils.js"></script>
  <script src="popup.js"></script>
</body>
</html>
