/*
 * Quiz Helper UI Redesign — Design Tokens
 * Brand: 题目助手 (Quiz Helper)
 * Theme mode: light-dark
 * Source language: zh
 *
 * Color architecture:
 *   1. Primitive palette — brand (indigo, from src/shared/variables.css),
 *      background / text / icon neutral scales, state-success / state-error /
 *      state-warning / state-info anchored on the original plugin palette.
 *   2. Semantic tokens — :root (light) and .dark map roles onto primitives.
 *      Components must only consume the semantic tokens below.
 */

:root {
  /* ===== PRIMITIVE PALETTE ===== */

  /* brand — indigo, matching original variables.css primary #4f46e5 */
  --brand-50: #eef2ff;
  --brand-100: #e0e7ff;
  --brand-200: #c7d2fe;
  --brand-300: #a5b4fc;
  --brand-400: #818cf8;
  --brand-500: #6366f1;
  --brand-600: #4f46e5;
  --brand-700: #4338ca;
  --brand-800: #3730a3;
  --brand-900: #312e81;

  /* background */
  --background-50: #ffffff;
  --background-100: #fafafa;
  --background-200: #f4f4f5;
  --background-300: #e8e8ec;
  --background-400: #e4e4e7;
  --background-500: #d4d4d8;
  --background-600: #a1a1aa;
  --background-700: #3f3f46;
  --background-800: #27272a;
  --background-900: #18181b;

  /* text */
  --text-50: #f4f4f5;
  --text-100: #e4e4e7;
  --text-200: #d4d4d8;
  --text-300: #a1a1aa;
  --text-400: #8b8e98;
  --text-500: #71717a;
  --text-600: #3f3f46;
  --text-700: #3a3a40;
  --text-800: #18181b;
  --text-900: #101012;

  /* icon */
  --icon-50: #f4f4f5;
  --icon-100: #e4e4e7;
  --icon-200: #d4d4d8;
  --icon-300: #a1a1aa;
  --icon-400: #8b8e98;
  --icon-500: #71717a;
  --icon-600: #3f3f46;
  --icon-700: #3a3a40;
  --icon-800: #27272a;
  --icon-900: #18181b;

  /* state-success — original variables.css green */
  --state-success: #16a34a;
  --state-success-dark: #4ade80;
  --state-success-surface: #f0fdf4;
  --state-success-foreground: #ffffff;

  /* state-error — original variables.css red */
  --state-error: #dc2626;
  --state-error-dark: #f87171;
  --state-error-surface: #fef2f2;
  --state-error-foreground: #ffffff;

  /* state-warning — original variables.css amber */
  --state-warning: #d97706;
  --state-warning-dark: #fbbf24;
  --state-warning-surface: #fffbeb;
  --state-warning-foreground: #ffffff;

  /* state-info — original variables.css sky */
  --state-info: #0284c7;
  --state-info-dark: #38bdf8;
  --state-info-surface: #f0f9ff;
  --state-info-foreground: #ffffff;

  /* ===== SEMANTIC ROLES ===== */

  --background: var(--background-50);
  --foreground: var(--text-800);
  --card: var(--background-50);
  --card-foreground: var(--text-800);
  --popover: var(--background-50);
  --popover-foreground: var(--text-900);

  --primary: var(--brand-600);
  --primary-foreground: var(--background-50);
  --secondary: var(--background-200);
  --secondary-foreground: var(--text-800);
  --muted: var(--background-100);
  --muted-foreground: var(--text-500);
  --accent: var(--background-100);
  --accent-foreground: var(--text-800);
  --destructive: var(--state-error);
  --destructive-foreground: var(--state-error-foreground);
  --success: var(--state-success);
  --success-foreground: var(--state-success-foreground);
  --border: #e8e8ec;
  --input: #e4e4e7;
  --ring: var(--brand-500);

  --icon: var(--icon-900);
  --icon-muted: var(--icon-500);

  /* sidebar */
  --sidebar: var(--background-200);
  --sidebar-foreground: var(--text-800);
  --sidebar-primary: var(--brand-600);
  --sidebar-primary-foreground: var(--background-50);
  --sidebar-accent: var(--background-300);
  --sidebar-accent-foreground: var(--text-800);
  --sidebar-border: var(--background-300);
  --sidebar-ring: var(--brand-500);

  /* TYPOGRAPHY */
  --font-sans: "DM Sans", -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", ui-sans-serif, sans-serif, system-ui;
  --font-serif: "DM Sans", -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", ui-sans-serif, sans-serif, system-ui;
  --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --tracking-normal: 0em;

  /* RADIUS */
  --radius: 1.2rem;
  --radius-sm: 0.5rem;
  --radius-md: 0.75rem;
  --radius-lg: 1.2rem;
  --radius-xl: 1.5rem;

  /* SHADOWS */
  --shadow-2xs: 0 1px 2px -1px rgba(0, 0, 0, 0.04);
  --shadow-xs: 0 1px 2px 0 rgba(0, 0, 0, 0.04);
  --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05), 0 1px 3px -1px rgba(0, 0, 0, 0.05);
  --shadow: 0 2px 4px -1px rgba(0, 0, 0, 0.06), 0 1px 2px -1px rgba(0, 0, 0, 0.05);
  --shadow-md: 0 4px 8px -2px rgba(0, 0, 0, 0.06), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
  --shadow-lg: 0 8px 24px -8px rgba(0, 0, 0, 0.08), 0 4px 8px -4px rgba(0, 0, 0, 0.05);
  --shadow-xl: 0 16px 40px -10px rgba(0, 0, 0, 0.10), 0 8px 16px -8px rgba(0, 0, 0, 0.06);
  --shadow-2xl: 0 24px 64px -12px rgba(0, 0, 0, 0.12);

  /* SPACING */
  --spacing: 0.24rem;
}

/* ===== SEMANTIC ROLES - dark (original variables.css body.dark palette) ===== */
.dark {
  --background: #131419;
  --foreground: var(--text-50);
  --card: #1a1c22;
  --card-foreground: #f4f4f5;
  --popover: #22242c;
  --popover-foreground: var(--text-50);

  --primary: var(--brand-400);
  --primary-foreground: var(--background-900);
  --secondary: #2a2d36;
  --secondary-foreground: #d4d4d8;
  --muted: #1a1c22;
  --muted-foreground: var(--text-400);
  --accent: #22242c;
  --accent-foreground: var(--text-50);
  --destructive: var(--state-error-dark);
  --destructive-foreground: var(--state-error-foreground);
  --success: var(--state-success-dark);
  --success-foreground: var(--state-success-foreground);
  --border: #2a2d36;
  --input: #34373f;
  --ring: var(--brand-400);

  --icon: var(--icon-50);
  --icon-muted: var(--icon-400);

  --sidebar: #1a1c22;
  --sidebar-foreground: var(--text-50);
  --sidebar-primary: var(--brand-400);
  --sidebar-primary-foreground: var(--background-900);
  --sidebar-accent: #2a2d36;
  --sidebar-accent-foreground: var(--text-50);
  --sidebar-border: #2a2d36;
  --sidebar-ring: var(--brand-400);

  --shadow-2xs: 0 1px 2px -1px rgba(0, 0, 0, 0.30);
  --shadow-xs: 0 1px 2px 0 rgba(0, 0, 0, 0.30);
  --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.36), 0 1px 3px -1px rgba(0, 0, 0, 0.36);
  --shadow: 0 2px 4px -1px rgba(0, 0, 0, 0.40), 0 1px 2px -1px rgba(0, 0, 0, 0.36);
  --shadow-md: 0 4px 8px -2px rgba(0, 0, 0, 0.44), 0 2px 4px -2px rgba(0, 0, 0, 0.36);
  --shadow-lg: 0 8px 24px -8px rgba(0, 0, 0, 0.50), 0 4px 8px -4px rgba(0, 0, 0, 0.40);
  --shadow-xl: 0 16px 40px -10px rgba(0, 0, 0, 0.55), 0 8px 16px -8px rgba(0, 0, 0, 0.44);
  --shadow-2xl: 0 24px 64px -12px rgba(0, 0, 0, 0.60);
}

/* ============================================================

 * Applied to .showcase.dark wrappers so the light/dark

.proto-dark {

  --shadow: 0 2px 4px -1px rgba(0, 0, 0, 0.40), 0 1px 2px -1px rgba(0, 0, 0, 0.36);
  --shadow-md: 0 4px 8px -2px rgba(0, 0, 0, 0.44), 0 2px 4px -2px rgba(0, 0, 0, 0.36);

.btn-secondary:hover{background:var(--muted)}

/* ============================================================
 * Card

 * rules: 12
 */
/* @anatomy

*/
.card{width:188px;min-height:148px;padding:calc(var(--spacing)*5);display:flex;flex-direction:column;justify-content:space-between;background:var(--card);color:var(--card-foreground);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-md);transition:transform .18s ease,box-shadow .18s ease}

.card.disabled,.card.disabled:hover{opacity:.5;transform:none;box-shadow:var(--shadow-md)}
.eyebrow,.meta{color:var(--muted-foreground);font-size:11px;letter-spacing:.08em;text-transform:uppercase}

/* ============================================================

 */

            /* ===== Prototype showcase page ===== */
            .page-shell { max-width: 920px; margin: 0 auto; padding: 56px 24px 40px; }
            .page-intro { max-width: 52ch; margin: 0 auto 44px; text-align: center; }
            .page-title { margin: 0; font-size: 32px; line-height: 1.2; font-weight: 700; letter-spacing: -0.01em; color: var(--foreground); }
            .intro-copy { margin: 12px 0 0; font-size: 15px; line-height: 1.7; color: var(--muted-foreground); }

            /* ===== Showcase stage ===== */
            .stage { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 28px; align-items: start; }
            .showcase { margin: 0; padding: 30px 22px; display: flex; flex-direction: column; align-items: center; gap: 18px; background: var(--muted); border: 1px solid var(--border); border-radius: var(--radius-xl); box-shadow: var(--shadow-sm); }
            .showcase.dark { background: var(--background); }
            .showcase-cap { display: flex; align-items: baseline; gap: 10px; }
            .showcase-cap strong { font-size: 14px; font-weight: 600; color: var(--foreground); }
            .showcase-cap span { font-size: 12px; color: var(--muted-foreground); }
            .showcase-stack { display: flex; flex-direction: column; align-items: center; gap: 18px; width: 100%; }
            .popup-demo { display: flex; flex-direction: column; align-items: center; gap: 10px; width: 100%; }

            /* ===== Popup window (300px) ===== */
            .popup { box-sizing: border-box; width: 300px; max-width: 100%; padding: 16px; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); }
            .popup-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
            .popup-title { margin: 0; font-size: 17px; font-weight: 700; letter-spacing: -0.01em; color: var(--foreground); }
            .popup .btn { width: 100%; border-radius: var(--radius-md); }
            .popup .btn-primary { height: 38px; padding: 0 14px; font-size: 14px; }
            .popup .btn-secondary { height: 38px; padding: 0 14px; font-size: 14px; }
            .popup .btn + .btn { margin-top: 10px; }
            .popup .btn svg { width: 16px; height: 16px; flex-shrink: 0; transition: transform .18s ease; }
            .popup .btn-primary:hover svg { transform: scale(1.08); }

            /* ===== Theme toggle ===== */
            .theme-toggle { position: relative; display: inline-flex; gap: 1px; padding: 2px; background: var(--secondary); border-radius: 999px; }
            .theme-toggle::before { content: ""; position: absolute; top: 2px; left: 2px; width: 28px; height: 26px; border-radius: 999px; background: var(--popover); box-shadow: var(--shadow-sm); transition: transform .18s ease; }
            .theme-toggle[data-active="1"]::before { transform: translateX(29px); }
            .theme-toggle[data-active="2"]::before { transform: translateX(58px); }
            .theme-btn { position: relative; z-index: 1; display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 26px; border: 0; border-radius: 999px; background: transparent; color: var(--icon-muted); cursor: pointer; transition: color .18s ease; }
            .theme-btn:hover { color: var(--foreground); }
            .theme-btn.active { color: var(--primary); }
            .theme-btn:focus-visible { outline: 2px solid var(--ring); outline-offset: 1px; }
            .theme-btn svg { width: 14px; height: 14px; }

            /* ===== Model dropdown (unified style, centered) ===== */
            .model-dropdown { position: relative; margin-top: 10px; }
            .model-dropdown:not(.open) .model-menu { display: none; }
            .model-btn { position: relative; display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; height: 38px; padding: 0 14px; background: var(--secondary); border: 0; border-radius: var(--radius-md); color: var(--foreground); font: 500 13px/1 var(--font-sans); text-align: center; transition: background-color .18s ease; }
            .model-btn:hover { background: var(--muted); }
            .model-btn:focus-visible { outline: 2px solid var(--ring); outline-offset: 1px; }
            .model-label { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
            .model-chevron { flex-shrink: 0; width: 15px; height: 15px; color: var(--icon-muted); transition: transform .18s ease; }
            .model-dropdown.open .model-chevron { transform: rotate(180deg); }
            .model-menu { position: absolute; top: calc(100% + 6px); left: 0; right: 0; z-index: 30; display: flex; flex-direction: column; gap: 2px; padding: 6px; background: var(--popover); border: 1px solid var(--border); border-radius: var(--radius-md); box-shadow: var(--shadow-lg); transform-origin: top center; animation: model-menu-in .18s cubic-bezier(.32, .72, 0, 1); }
            .model-option { position: relative; display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; height: 34px; padding: 0 10px; border: 0; border-radius: var(--radius-sm); background: transparent; color: var(--foreground); font: 400 13px/1 var(--font-sans); text-align: center; cursor: pointer; transition: background-color .18s ease, color .18s ease; }
            .model-option:hover { background: var(--secondary); }
            .model-option.selected { font-weight: 600; }
            .model-option.selected:hover { background: var(--secondary); }
            .model-option.selected svg { position: absolute; right: 10px; width: 15px; height: 15px; color: var(--primary); }
            @keyframes model-menu-in { from { opacity: 0; transform: translateY(-4px) scale(.98); } to { opacity: 1; transform: translateY(0) scale(1); } }

            /* ===== Popup footer ===== */
            .popup-footer { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 14px; }
            .popup-hint { margin: 0; min-width: 0; font-size: 12px; color: var(--muted-foreground); }

            .popup-version { flex-shrink: 0; font: 500 11px/1 var(--font-mono); color: var(--muted-foreground); }

            /* ===== Page footer ===== */

            .page-footer p { margin: 0; font-size: 12px; color: var(--muted-foreground); }

            @media (max-width: 720px) {
                .page-shell { padding: 40px 20px 32px; }
                .stage { grid-template-columns: minmax(0, 1fr); }
            }
            @media (prefers-reduced-motion: reduce) {
                .theme-toggle::before, .theme-btn, .model-chevron, .model-btn, .model-menu, .model-option, .popup .btn svg { transition: none; }
                .model-menu { animation: none; }
            }
        </style>
