name: Release Extension

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          TAG_NAME="${GITHUB_REF_NAME}"
          TAG_VERSION="${TAG_NAME#v}"
          MANIFEST_VERSION="$(python3 - <<'PY'
          import json
          from pathlib import Path
          print(json.loads(Path("src/manifest.json").read_text(encoding="utf-8"))["version"])
          PY
          )"

          if [[ "${TAG_VERSION}" != "${MANIFEST_VERSION}" ]]; then
            echo "Tag version (${TAG_VERSION}) does not match manifest version (${MANIFEST_VERSION})."
            exit 1
          fi

          echo "tag_name=${TAG_NAME}" >> "${GITHUB_OUTPUT}"
          echo "version=${MANIFEST_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "zip_name=quiz-helper-v${MANIFEST_VERSION}.zip" >> "${GITHUB_OUTPUT}"

      - name: Build release package
        shell: bash
        run: |
          set -euo pipefail

          rm -rf dist
          mkdir -p dist/package

          rsync -a src/ dist/package/ \
            --exclude ".DS_Store"

          (
            cd dist/package
            zip -r "../${{ steps.version.outputs.zip_name }}" .
          )

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag_name }}
          name: ${{ steps.version.outputs.tag_name }}
          generate_release_notes: true
          files: dist/${{ steps.version.outputs.zip_name }}
