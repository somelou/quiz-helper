<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 260px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #fff;
    }
    h2 {
      font-size: 16px;
      margin: 0 0 12px 0;
      color: #333;
    }
    .btn {
      width: 100%;
      padding: 10px;
      margin-bottom: 10px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.9; }
    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }
    .btn-secondary {
      background: #f0f0f0;
      color: #333;
    }
    .hint {
      font-size: 11px;
      color: #888;
      margin-top: 8px;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <h2>题目助手</h2>
  <button class="btn btn-primary" id="analyzeBtn">分析当前页面题目</button>
  <button class="btn btn-secondary" id="optionsBtn">打开设置</button>
  <div class="hint">提示：选中题目文本后分析效果更佳<br>支持单选、多选、判断、填空等题型</div>
  <script src="popup.js"></script>
</body>
</html>
